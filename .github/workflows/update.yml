name: Mise à jour des marchés

on:
  schedule:
    - cron: "5 * * * *"   # toutes les heures, à hh:05
  workflow_dispatch:       # permet de le lancer à la main pour tester

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pandas requests

      - run: python generate.py
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}

      - name: Enregistrer les nouvelles données
        run: |
          git config user.name "market-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "maj données" && git push)
